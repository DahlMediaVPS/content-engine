<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: linear-gradient(160deg,#fbe9e7,#f3d9cf 60%,#e8c4b4);
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #title {
        color: #3b2a24; text-align:center;
        font-size: 96px; line-height:1.05;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
    >
      <h1 id="title" class="clip" data-start="0" data-duration="5" data-track-index="0">Glass Skin<br/>in 7 Days</h1>
      <p id="sub" class="clip" data-start="0" data-duration="5" data-track-index="1" style="position:absolute;bottom:420px;width:100%;text-align:center;font:500 44px Inter,sans-serif;color:#8a5a48;letter-spacing:.2em">ORGANIC CASTOR OIL</p>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title",{opacity:0,y:60,scale:.92},{opacity:1,y:0,scale:1,duration:.9,ease:"power3.out"},0.2);
      tl.fromTo("#sub",{opacity:0,y:30},{opacity:1,y:0,duration:1.1,ease:"power2.out"},0.9);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
