<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Castor Oil Promo — 9:16 motion sample</title>
<style>
  /* 1080x1920 composition. Every frame is a pure function of time: window.seek(t). */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#f6efe6}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#2b2118}
  .layer{position:absolute;inset:0}

  /* Scene 1 — text-as-gradient title */
  .title{position:absolute;left:0;right:0;text-align:center;font-weight:800;
    font-size:132px;line-height:0.95;letter-spacing:-4px;padding:0 40px;white-space:nowrap;
    background:linear-gradient(100deg,#7a4a1b 0%,#c98a3a 30%,#fff3d6 50%,#c98a3a 70%,#7a4a1b 100%);
    background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
  #t1{top:720px}
  #t2{top:880px}
  .kicker{position:absolute;left:0;right:0;top:600px;text-align:center;font-size:30px;
    letter-spacing:12px;text-transform:uppercase;color:#8a6a4a}

  /* Scene 2 — dark spotlight over a bottle */
  #s2{background:#1a120c}
  #spot{position:absolute;inset:0;pointer-events:none}
  #bottle{position:absolute;left:50%;top:560px;width:280px;height:560px;margin-left:-140px;
    border-radius:44px;background:linear-gradient(90deg,#4a2a0e 0%,#c98a3a 35%,#e7b96a 55%,#7a4a1b 100%);
    box-shadow:0 40px 90px rgba(0,0,0,.6)}
  #cap{position:absolute;left:50%;top:-70px;width:150px;height:90px;margin-left:-75px;
    border-radius:14px 14px 6px 6px;background:#111}
  #label{position:absolute;left:24px;right:24px;top:200px;height:230px;border-radius:14px;
    background:#fbf6ee;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#2b2118}
  #label b{font-size:44px;letter-spacing:4px}
  #label span{font-size:20px;margin-top:10px;color:#8a6a4a;letter-spacing:2px;white-space:nowrap}
  #cold{position:absolute;left:0;right:0;top:1260px;text-align:center;color:#f3dcb0;
    font-size:64px;font-weight:300;letter-spacing:10px;text-transform:uppercase}

  /* Scene 3 — card stack deal + count-up */
  #s3{background:#f6efe6}
  #head3{position:absolute;left:0;right:0;top:300px;text-align:center;font-size:88px;font-weight:800;letter-spacing:-2px}
  #count{position:absolute;left:0;right:0;top:470px;text-align:center;font-size:260px;font-weight:800;color:#c98a3a;line-height:1}
  #countLbl{position:absolute;left:0;right:0;top:760px;text-align:center;font-size:34px;letter-spacing:10px;text-transform:uppercase;color:#8a6a4a}
  .card{position:absolute;left:50%;top:1000px;width:700px;height:420px;margin-left:-350px;border-radius:36px;
    background:#fff;box-shadow:0 30px 60px rgba(90,60,30,.18);padding:56px;display:flex;flex-direction:column;justify-content:space-between}
  .card .n{font-size:30px;letter-spacing:6px;color:#c98a3a;font-weight:700}
  .card .t{font-size:104px;font-weight:800;letter-spacing:-3px}

  /* Scene 4 — flash cuts, wordmark, CTA */
  #s4{background:#1a120c}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  #wordmark{position:absolute;left:0;right:0;top:820px;text-align:center;font-size:110px;font-weight:800;
    letter-spacing:22px;color:#f3dcb0;padding-left:22px}
  #cta{position:absolute;left:50%;top:1080px;height:116px;width:600px;margin-left:-300px;border-radius:58px;
    background:#c98a3a;color:#1a120c;font-size:44px;font-weight:700;letter-spacing:2px;
    display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="stage">

  <!-- Scene 1 · 0.0–2.9s -->
  <section id="s1" class="layer" style="background:#f6efe6">
    <div class="kicker" id="kick">Placeholder kicker</div>
    <div class="title" id="t1">Slow-pressed</div>
    <div class="title" id="t2">castor oil.</div>
  </section>

  <!-- Scene 2 · 2.9–5.1s -->
  <section id="s2" class="layer">
    <div id="bottle">
      <div id="cap"></div>
      <div id="label"><b>BRAND</b><span>CASTOR OIL · 100 ml</span></div>
    </div>
    <div id="spot"></div>
    <div id="cold">Cold-pressed</div>
  </section>

  <!-- Scene 3 · 5.0–8.3s -->
  <section id="s3" class="layer">
    <div id="head3">Three steps. That's it.</div>
    <div id="count">00</div>
    <div id="countLbl">steps</div>
    <div class="card" id="c0" style="z-index:1"><div class="n">01</div><div class="t">Cleanse</div></div>
    <div class="card" id="c1" style="z-index:2"><div class="n">02</div><div class="t">Oil</div></div>
    <div class="card" id="c2" style="z-index:3"><div class="n">03</div><div class="t">Seal</div></div>
  </section>

  <!-- Scene 4 · 8.3–12.0s -->
  <section id="s4" class="layer">
    <div id="wordmark">BRAND</div>
    <div id="cta">Shop castor oil →</div>
    <div id="flash"></div>
  </section>

</div>

<script>
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const prog  = (t, a, b) => clamp((t - a) / (b - a));
  const eo3   = x => 1 - Math.pow(1 - x, 3);
  const backOut = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  // opacity envelope: fades in over `fade` s after a, out before b
  const vis = (t, a, b, fade = 0.2) => clamp(Math.min((t - a) / fade, (b - t) / fade));
  const $ = id => document.getElementById(id);

  window.seek = function (t) {
    // Scene visibility
    $('s1').style.opacity = vis(t, 0, 2.9, 0.15);
    $('s2').style.opacity = vis(t, 2.9, 5.1, 0.15);
    $('s3').style.opacity = vis(t, 5.0, 8.3, 0.15);
    $('s4').style.opacity = vis(t, 8.3, 12.01, 0.12);

    // Scene 1: kicker + two-line gradient-mask title, gradient sweeps across the type
    $('kick').style.opacity = prog(t, 0.1, 0.6);
    const sweep = 100 - eo3(prog(t, 0.3, 2.4)) * 100;
    for (const id of ['t1', 't2']) {
      const d = id === 't2' ? 0.25 : 0;
      const p = prog(t, 0.3 + d, 0.95 + d);
      $(id).style.opacity = p;
      $(id).style.transform = `translateY(${(1 - eo3(p)) * 80}px)`;
      $(id).style.backgroundPosition = `${sweep}% 0`;
    }

    // Scene 2: bottle rises, spotlight sweeps across the dark stage, label reads "cold-pressed"
    const bp = eo3(prog(t, 2.9, 3.7));
    $('bottle').style.transform = `translateY(${(1 - bp) * 160}px)`;
    const sx = -30 + prog(t, 2.9, 4.9) * 160;
    $('spot').style.background =
      `radial-gradient(circle 460px at ${sx}% 38%, rgba(255,226,170,.55), rgba(255,226,170,0) 70%)`;
    $('cold').style.opacity = prog(t, 3.5, 4.0);

    // Scene 3: headline, count-up 00→03, three cards deal in with overshoot
    $('head3').style.opacity = prog(t, 5.0, 5.5);
    const n = Math.round(eo3(prog(t, 5.6, 6.6)) * 3);
    $('count').textContent = String(n).padStart(2, '0');
    $('countLbl').style.opacity = prog(t, 5.6, 6.0);
    for (let i = 0; i < 3; i++) {
      const start = 5.1 + i * 0.22;
      const p = prog(t, start, start + 0.7);
      const fromX = (1 - backOut(p)) * 900;            // swoop in from the right
      const rot = (i - 1) * 5;
      const dy = (2 - i) * -6;                          // slight stack offset
      $('c' + i).style.opacity = clamp(p * 3);
      $('c' + i).style.transform =
        `translate(${fromX + (i - 1) * 60}px, ${dy}px) rotate(${rot}deg)`;
    }

    // Scene 4: two paparazzi-style flash cuts, wordmark scales in, CTA rises
    const flashOn = [8.3, 8.5].some(a => t >= a && t < a + 0.06);
    $('flash').style.opacity = flashOn ? 0.9 : 0;
    const wp = prog(t, 8.6, 9.4);
    $('wordmark').style.opacity = prog(t, 8.6, 9.1);
    $('wordmark').style.transform = `scale(${0.92 + 0.08 * eo3(wp)})`;
    const cp = prog(t, 9.6, 10.2);
    $('cta').style.opacity = cp;
    $('cta').style.transform = `translateY(${(1 - eo3(cp)) * 40}px)`;
  };
  window.seek(0);
</script>
</body>
</html>
